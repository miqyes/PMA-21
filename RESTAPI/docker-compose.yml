services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: phonedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Andrianochkaq
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=phonedb;Username=postgres;Password=Andrianochkaq"
    depends_on:
      - db

volumes:
  pgdata:
    